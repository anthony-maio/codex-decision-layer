name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: uv sync --extra mcp --locked --python 3.12
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run --extra mcp python tests/smoke_mcp.py
      - run: uv build --wheel
      - shell: bash
        run: uv run python scripts/validate_install.py --wheel "$(echo dist/*.whl)" --output results/local-ci-install.json
