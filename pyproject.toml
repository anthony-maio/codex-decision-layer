[project]
name = "codex-evidence-selector"
version = "0.1.1rc1"
description = "Shadow-mode evidence selection with Jev, local Eve, and a lexical baseline"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]
ratchet = ["pytest~=8.4.2"]
local = ["torch>=2.7,<3", "transformers>=5,<6", "safetensors>=0.5", "huggingface-hub>=1,<2", "numpy>=2"]

[project.scripts]
evidence-selector = "evidence_selector.cli:main"
ratchet = "evidence_selector.ratchet.cli:main"
eve-decision-server = "evidence_selector.eve_server:main"
gguf-decision-server = "evidence_selector.gguf_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evidence_selector"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
